services:
  # 1. AWS LocalStack Community Emulator (S3, DynamoDB, SQS, Secrets Manager)
  localstack:
    image: localstack/localstack:3.8
    container_name: localstack-aws
    ports:
      - "4566:4566"
    environment:
      - AWS_DEFAULT_REGION=${AWS_REGION:-us-east-1}
      - DOCKER_HOST=unix:///var/run/docker.sock
      - DEBUG=0
      - ACTIVATE_PRO=0
    volumes:
      - "${LOCALSTACK_VOLUME_DIR:-./.localstack}:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Local AWS Resource Initializer
  init-aws:
    image: amazon/aws-cli:latest
    container_name: localstack-init
    depends_on:
      localstack:
        condition: service_healthy
    volumes:
      - ./src/scripts/init-aws.sh:/scripts/init-aws.sh
    entrypoint: /bin/sh
    command: -c "chmod +x /scripts/init-aws.sh && /scripts/init-aws.sh"
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}
      - AWS_DEFAULT_REGION=${AWS_REGION:-us-east-1}
      - LOCALSTACK_ENDPOINT=http://localstack:4566

  # 3. MySQL Database (Multi-User Sessions, OAuth Tokens & Expiration Management)
  # Host port mapped to 3307 to prevent collisions with host MySQL running on 3306
  mysql-db:
    image: mysql:8.0
    container_name: salesforce-mysql-db
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    environment:
      - MYSQL_DATABASE=salesforce_integration
      - MYSQL_USER=${MYSQL_USER:-app_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-app_password}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root_password}
    volumes:
      - ./src/scripts/init-mysql.sql:/docker-entrypoint-initdb.d/init-mysql.sql
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "app_user", "-papp_password"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 4. Integration Sync Engine (FastAPI Middleware with OAuth2 & Secrets Manager)
  integration-engine:
    build:
      context: ./src/integration-engine
      dockerfile: Dockerfile
    container_name: integration-sync-engine
    ports:
      - "8000:8000"
    depends_on:
      localstack:
        condition: service_healthy
      mysql-db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL:-http://localstack:4566}
      - AWS_DEFAULT_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}
      - S3_RAW_EVENTS_BUCKET=${S3_RAW_EVENTS_BUCKET:-salesforce-raw-events}
      - S3_BACKUPS_BUCKET=${S3_BACKUPS_BUCKET:-salesforce-backups}
      - DYNAMODB_TABLE_NAME=${DYNAMODB_TABLE_NAME:-SalesforceSyncRecords}
      - SQS_INBOUND_QUEUE_NAME=${SQS_INBOUND_QUEUE_NAME:-salesforce-inbound-queue}
      - SQS_DLQ_NAME=${SQS_DLQ_NAME:-salesforce-deadletter-queue}
      # MySQL Settings (Internal docker network connects to mysql-db:3306)
      - MYSQL_HOST=mysql-db
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER:-app_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-app_password}
      - MYSQL_DATABASE=salesforce_integration
      # Salesforce OAuth 2.0 Auth Code Settings
      - SALESFORCE_LOGIN_URL=${SALESFORCE_LOGIN_URL:-https://login.salesforce.com}
      - SALESFORCE_CLIENT_ID=${SALESFORCE_CLIENT_ID:-}
      - SALESFORCE_CLIENT_SECRET=${SALESFORCE_CLIENT_SECRET:-}
      - SALESFORCE_REDIRECT_URI=${SALESFORCE_REDIRECT_URI:-http://localhost:8000/api/auth/salesforce/callback}
      - SALESFORCE_API_VERSION=${SALESFORCE_API_VERSION:-v58.0}
      - FRONTEND_REDIRECT_URL=http://localhost:3000
    restart: unless-stopped
    volumes:
      - ./src/integration-engine/app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  # 5. Management UI Dashboard with Vercel CLI (Module: src/dashboard-ui)
  dashboard-ui:
    build:
      context: ./src/dashboard-ui
      dockerfile: Dockerfile
    container_name: integration-dashboard-ui
    ports:
      - "3000:3000"
    volumes:
      - ./src/dashboard-ui:/app
    depends_on:
      - integration-engine
    restart: unless-stopped

  # 6. Ad-hoc AWS CLI container
  aws-cli:
    image: amazon/aws-cli:latest
    container_name: aws-cli-runner
    depends_on:
      - localstack
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}
      - AWS_DEFAULT_REGION=${AWS_REGION:-us-east-1}
    entrypoint: /bin/sh
    command: -c "tail -f /dev/null"

volumes:
  mysql_data:
